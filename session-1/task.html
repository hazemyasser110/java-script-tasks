                <div class="relative bg-gray-50 rounded-xl flex-1

      </div>

      <div class="pt-2">
        
        <span class="inline-block bg-red-700 text-white
                     text-xs font-bold px-2 py-1 mb-3">
          SALES
        </span>

        <div class="flex items-start justify-between gap-3">
          <h1 class="text-xl md:text-2xl font-bold">

          </h1>

          <button class="text-2xl hover:text-red-500"
                  aria-label="Add to favorites">
            ♡
          </button>
        </div>

        <div class="flex items-center gap-2 mt-3 text-sm">
          <span class="text-yellow-500">★★★★☆</span>
          <span class="text-gray-500 text-xs">
            (11.78K reviews)
          </span>
        </div>

        <div class="flex items-center gap-3 mt-3">
          <span class="text-xl font-bold">$62.97</span>
          <span class="text-gray-400 line-through">$72.97</span>
          <span class="bg-yellow-400 text-xs font-semibold px-2 py-1">

          </span>
        </div>

        <div class="mt-8">
          <p class="text-sm mb-3">
            Color: <span class="font-semibold">Green</span>
          </p>

          <div class="flex gap-3">
            <button class="w-7 h-7 rounded-full border-2
                           border-gray-500 bg-gray-200
                           ring-2 ring-gray-200"
                    aria-label="Gray"></button>

            <button class="w-7 h-7 rounded-full border
                           border-blue-300 bg-blue-100"
                    aria-label="Blue"></button>

            <button class="w-7 h-7 rounded-full border
                           border-yellow-400 bg-yellow-100"
                    aria-label="Yellow"></button>

            <button class="w-7 h-7 rounded-full border
                           border-red-300 bg-red-100"
                    aria-label="Red"></button>
          </div>
        </div>

        <div class="mt-7">
          <p class="text-sm font-semibold mb-3">
            Pack Size:
            <span id="selected-size" class="font-normal">250 ML</span>
          </p>

          <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
            <button class="size-btn border rounded-md py-2 text-xs"
                    data-size="60 ML">60 ML</button>

            <button class="size-btn border rounded-md py-2 text-xs"
                    data-size="120 ML">120 ML</button>

            <button class="size-btn border rounded-md py-2 text-xs"
                    data-size="220 ML">220 ML</button>

            <button class="size-btn bg-emerald-950 text-white

                    data-size="500 ML">500 ML</button>

            <div class="flex items-center border rounded-md h-11">
              <button id="minus"
                      class="px-4 text-gray-500 hover:text-black">
                −
              </button>

              <span id="quantity"
                    class="px-3 text-sm min-w-8 text-center">1</span>

              <button id="plus"
                      class="px-4 text-gray-500 hover:text-black">
                +
              </button>

            <button

                     text-black rounded-md h-11 font-semibold
                     text-sm min-w-24">

              class="flex-1 bg-emerald-950 hover:bg-emerald-900
                     text-white rounded-md h-11 font-semibold
                     text-sm min-w-28">

            </button>
          </div>
        </div>

        
        <div class="flex gap-5 mt-8 text-sm text-blue-700">
          <a href="#" class="hover:underline">Share ↗</a>
          <a href="#" class="hover:underline">Compare ⇄</a>
        </div>

        
        <div class="mt-6 space-y-4 text-sm">

            <span class="text-gray-500">:</span>

          </div>

            <span class="font-semibold min-w-24">Categories</span>
